<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDENA · Tags</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/vendor/mosp-design-system/styles.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="container-fluid py-3">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Tag editor</h1>
        <p class="text-secondary mb-0">Create, rename and colour the tags used to organise MIDENA diagrams.</p>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header">New tag</div>
          <div class="card-body">
            <form id="newTagForm" class="vstack gap-3">
              <div>
                <label for="newTagName" class="form-label">Name</label>
                <input id="newTagName" class="form-control" maxlength="80" required placeholder="e.g. onboarding">
              </div>
              <div>
                <label for="newTagColor" class="form-label">Colour</label>
                <div class="input-group">
                  <input id="newTagColor" class="form-control form-control-color" type="color" value="#6f42c1" title="Choose tag colour">
                  <button class="btn btn-outline-secondary" type="button" id="randomTagColorBtn"><i class="bi bi-shuffle me-1"></i>Random</button>
                </div>
              </div>
              <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg me-1"></i>Add tag</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center"><span>Existing tags</span><span id="tagCount" class="badge text-bg-secondary">0</span></div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Tag</th><th>Colour</th><th>Diagrams</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="tagRows"><tr><td colspan="4" class="text-secondary p-4">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/mosp-ui-config.js"></script>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="/mosp-shell.js"></script>
  <script src="/app.js"></script>
  <script src="/pages/tags.js"></script>
</body>
</html>
