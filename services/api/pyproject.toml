[tool.poetry]
name = "midena-api"
version = "0.1.0"
description = "MIDENA FastAPI backend"
authors = ["MIDENA Team <noreply@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = {version = "^0.53.0", extras = ["standard"]}
SQLAlchemy = "^2.0.47"
alembic = "^1.18.4"
psycopg = {version = "^3.3.3", extras = ["binary"]}
psycopg2-binary = "^2.9.11"
pydantic = "^2"
pydantic-core = "^2.47"
pydantic-settings = "^2.13.1"
python-multipart = "^0.0.32"
itsdangerous = "^2.2.0"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
bcrypt = "^5.0.0"
starlette = "^1"
authlib = "^1.6.8"
httpx = "^0.28.0"
google-api-python-client = "^2.187.0"
google-auth = "^2.41.1"
celery = "^5.6.2"
redis = "^8"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
