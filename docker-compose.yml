services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-midena}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5445:5432"
    networks: [midenanet]
    restart: unless-stopped

  midena-api:
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8183:8080"
    networks: [midenanet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: valkey/valkey:7.2
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    networks: [midenanet]
    restart: unless-stopped

  midena-worker:
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["./scripts/start-celery-worker.sh"]
    networks: [midenanet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  midena-beat:
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["./scripts/start-celery-beat.sh"]
    volumes:
      - beatdata:/var/lib/midena
    networks: [midenanet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  midena-ui:
    build:
      context: ..
      dockerfile: midena/services/ui/Dockerfile
    env_file: .env
    depends_on:
      - midena-api
    ports:
      - "127.0.0.1:8083:80"
    networks: [midenanet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  beatdata:

networks:
  midenanet:
    driver: bridge
